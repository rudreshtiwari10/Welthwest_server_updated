services:
  - type: web
    name: stock-market-api
    env: python
    pythonVersion: "3.11.10"
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    # server.py, not app.py directly -- it starts the in-process scheduler
    # thread (news pipeline every 2h, top-gainers refresh every 15min)
    # before serving the Flask app. Pointing this at `gunicorn app:app`
    # would bring the API up fine but silently never run the pipeline.
    startCommand: python server.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: FRONTEND_URL
        value: "*"
      - key: RENDER
        value: "true"
      - key: FLASK_ENV
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11"