services:
  - type: web
    name: stock-market-api
    env: python
    pythonVersion: "3.11.10"
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: FRONTEND_URL
        value: "*"
      - key: RENDER
        value: "true"
      - key: FLASK_ENV
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11"